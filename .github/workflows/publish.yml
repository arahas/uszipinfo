name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uszipinfo
    permissions:
      id-token: write   # Required for trusted publishing (no token needed)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml=$PKG_VERSION but git tag=$TAG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Build distributions
        run: python -m build

      - name: Verify the wheel includes the bundled data
        run: |
          unzip -l dist/*.whl | grep zip_metadata_2022.parquet || {
            echo "ERROR: bundled Parquet missing from wheel"
            exit 1
          }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password / token needed: uses OIDC trusted publishing
